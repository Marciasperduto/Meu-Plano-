<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Meu Plano 2027</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Nunito:wght@400;500;600;700;800&display=swap">
<style>
  /* Layout: app de uma coluna com barra de abas embaixo. Paleta algodão-doce: rosa suave, azul-céu e amarelo-manteiga sobre fundo rosado claro, com texto azul-marinho suave. */
  :root{
    color-scheme:light;
    --bg:#FFF8F6; --surface:#FFFFFF; --surface-2:#FEEFF2; --ink:#2D3650; --ink-soft:#5B6580; --line:#F1DFE3;
    --pink:#F5A9BB; --pink-soft:#FDE4EA; --pink-ink:#B73F63;
    --sky:#BEE3F7; --sky-soft:#E6F4FC; --sky-ink:#1F5C80; --sky-dark:#7CC0E6;
    --sun:#FFE6A1; --sun-soft:#FFF4D4; --sun-ink:#6A5000;
    --hero:linear-gradient(135deg,#FBD3DD 0%,#FFE6BD 100%);
    --danger:#B23A55;
    --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
    --font-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
    --radius:20px;
  }
  *{box-sizing:border-box}
  body{margin:0}
  [hidden]{display:none!important}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.55;
    padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:18px 120px;
  }
  button,input,select,textarea{font-family:inherit}
  h1:focus{outline:none}
  :focus-visible{outline:3px solid var(--pink-ink); outline-offset:2px}
  .app{max-width:760px;margin:0 auto}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .muted{color:var(--ink-soft)}
  .small{font-size:.88rem}

  .topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 16px;margin-bottom:12px}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:1.25rem;letter-spacing:-.01em}
  .brand .p{fill:none;stroke:var(--pink-ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  .brand .d0{fill:var(--bg);stroke:var(--pink-ink);stroke-width:2}
  .brand .d1{fill:var(--pink)}
  .brand .d2{fill:var(--sky-dark)}
  .status{font-size:.78rem;font-weight:600;color:var(--ink-soft)}
  .hdr-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .pill{font-weight:700;font-size:.85rem;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:38px;position:relative}
  .dotnew{position:absolute;top:-8px;right:-4px;min-width:20px;height:20px;border-radius:99px;background:var(--pink-ink);color:#fff;font-size:.72rem;display:grid;place-items:center;padding:0 5px}

  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
    padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));
    padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .tabbar-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
  .tab{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--ink-soft);font-weight:700;font-size:.72rem;padding:6px 2px;border-radius:14px;cursor:pointer;min-height:52px}
  .tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tab[aria-current="page"]{background:var(--pink-soft);color:var(--pink-ink)}

  .toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--ink);color:var(--surface);
    padding:10px 18px;border-radius:999px;font-weight:700;font-size:.92rem;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:30;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  .wiz-top{display:flex;justify-content:flex-end;margin-bottom:4px}
  .progress{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:18px}
  .seg{display:flex;flex-direction:column;gap:6px;min-width:0}
  .seg-bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
  .seg-bar i{display:block;height:100%;background:var(--pink);border-radius:99px;transition:width .3s}
  .seg-name{font-size:11.5px;line-height:1.25;color:var(--ink-soft);text-wrap:balance;font-weight:600}
  .seg.current .seg-name{color:var(--ink);font-weight:800}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px}
  .card+.card{margin-top:14px}
  @media (max-width:520px){.card{padding:20px 16px}}
  .kicker{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--pink-ink);margin:0 0 8px}
  .h-title,.q-title{font-family:var(--font-display);font-weight:600;font-size:clamp(1.5rem,1.1rem + 1.8vw,2.1rem);line-height:1.18;letter-spacing:-.015em;margin:0 0 10px;text-wrap:balance}
  .h2{font-family:var(--font-display);font-weight:600;font-size:1.25rem;letter-spacing:-.01em;margin:0 0 10px;line-height:1.2}
  .help{color:var(--ink-soft);margin:0 0 20px;max-width:62ch}
  .examples{background:var(--sun-soft);border-radius:14px;padding:14px 16px;margin:-4px 0 22px}
  .ex-title{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sun-ink);margin:0 0 6px}
  .examples ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.92rem;color:var(--sun-ink)}
  .gets{list-style:none;padding:0;margin:0 0 22px;display:grid;gap:8px}
  .gets li{position:relative;padding-left:24px}
  .gets li::before{content:"";position:absolute;left:0;top:.55em;width:12px;height:12px;border-radius:50%;background:var(--pink)}
  .defs{margin:0 0 18px;display:grid;gap:10px}
  .defs div{background:var(--sky-soft);border-radius:14px;padding:12px 14px}
  .defs dt{font-weight:800;color:var(--sky-ink)}
  .defs dd{margin:2px 0 0;color:var(--ink)}
  .how-list{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:10px}
  .how-list li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:start}
  .how-list b{background:var(--pink-soft);color:var(--pink-ink);border-radius:999px;padding:3px 10px;text-align:center;font-size:.85rem}
  @media (max-width:420px){.how-list li{grid-template-columns:minmax(0,1fr)}.how-list b{justify-self:start}}
  .stepdots{display:flex;gap:6px;margin-bottom:16px}
  .stepdots i{width:28px;height:8px;border-radius:99px;background:var(--surface-2)}
  .stepdots i.on{background:var(--pink)}

  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
  .lbl{font-weight:700;font-size:.95rem}
  .lbl-sub{font-weight:500;color:var(--ink-soft)}
  input[type=text],input[type=date],input[type=number],textarea,select{
    font-size:16px;width:100%;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);
    border-radius:14px;padding:12px 14px;min-width:0
  }
  textarea{min-height:120px;resize:vertical;line-height:1.55}
  input:focus,textarea:focus,select:focus{outline:3px solid var(--pink);outline-offset:0;border-color:var(--pink-ink)}
  ::placeholder{color:var(--ink-soft);opacity:.7}
  input[type=range]{width:100%;accent-color:#E98AA4;height:32px}
  .inline{display:flex;align-items:center;gap:10px}
  .inline input[type=number]{max-width:110px}
  .suffix{color:var(--ink-soft)}
  .check-row{display:flex;align-items:flex-start;gap:10px;font-weight:600;cursor:pointer}
  .check-row input{width:22px;height:22px;margin:2px 0 0;accent-color:#E98AA4;flex:none}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-size:.92rem;font-weight:700;padding:9px 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-width:48px;min-height:42px}
  .chip[aria-pressed="true"]{background:var(--pink);border-color:var(--pink-ink);color:var(--ink)}
  .chips.folga .chip[aria-pressed="true"]{background:var(--sky);border-color:var(--sky-ink)}

  .info{background:var(--sky-soft);border-radius:14px;padding:16px;margin-top:18px}
  .info p{margin:0 0 10px}
  .info p:last-child{margin-bottom:0}
  .note{background:var(--sun-soft);color:var(--sun-ink);border-radius:14px;padding:12px 14px;font-size:.92rem;margin-top:12px;font-weight:600}
  .remind{background:var(--sun-soft);color:var(--sun-ink);border-radius:var(--radius);padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin-top:14px;font-weight:600}
  .minibar{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:12px 0 10px;background:var(--surface-2)}
  .minibar .w{background:var(--pink)}
  .minibar .f{background:var(--sky-dark)}
  .mini-legend{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-wrap:wrap;gap:4px 18px;font-size:.88rem}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
  .dot.w{background:var(--pink)}
  .dot.f{background:var(--sky-dark)}

  .actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:24px}
  .spacer{flex:1}
  .btn{font-weight:800;font-size:.98rem;padding:12px 22px;border-radius:999px;border:1.5px solid transparent;cursor:pointer;min-height:46px}
  .btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
  .btn-sm{padding:8px 16px;min-height:40px;font-size:.9rem}
  .btn-primary{background:var(--pink);color:var(--ink)}
  .btn-primary:hover{filter:brightness(.96)}
  .btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
  .btn-text{background:none;border:none;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;padding:10px 6px;cursor:pointer;font-weight:700}
  .btn-danger{background:var(--surface);color:var(--danger);border-color:var(--danger)}
  .edit{background:none;border:none;color:var(--pink-ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px 0;font-size:inherit;font-weight:700}

  .banner{background:var(--pink-soft);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;font-weight:600}
  .banner.demo{background:var(--sky-soft)}

  .plan-sub{color:var(--ink-soft);margin:0 0 20px;max-width:60ch}
  .hero{background:var(--hero);color:var(--ink);border-radius:var(--radius);padding:26px;display:grid;gap:20px}
  @media (max-width:520px){.hero{padding:20px 16px}}
  .hero .kicker{color:var(--pink-ink)}
  .hero h2{font-family:var(--font-display);font-weight:600;font-size:clamp(1.4rem,1.1rem + 1.4vw,1.9rem);line-height:1.2;letter-spacing:-.01em;margin:0;overflow-wrap:anywhere}
  .hero-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
  @media (max-width:640px){.hero-cols{grid-template-columns:minmax(0,1fr)}}
  .quote{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
  .hero-empty{color:var(--ink-soft)}
  .hero-foot{margin:0}

  .section{margin-top:28px}
  .sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px;margin-bottom:10px}
  .sec-head h2{font-family:var(--font-display);font-weight:600;font-size:1.25rem;letter-spacing:-.01em;margin:0}

  .tlbar{display:flex;height:18px;border-radius:99px;overflow:hidden;background:var(--surface-2);margin-bottom:18px}
  .tlbar .w{background:var(--pink)}
  .tlbar .f{background:var(--sky-dark)}
  .tllegend{list-style:none;margin:0;padding:0;display:grid;gap:10px}
  .tllegend li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px;align-items:start}
  .tllegend .dot{margin:6px 0 0}
  .where{margin:0 0 14px}

  .marco{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-top:14px}
  @media (max-width:520px){.marco{padding:18px 16px}}
  .marco-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:6px 16px;margin-bottom:14px}
  .marco h3{font-family:var(--font-display);font-weight:600;font-size:1.3rem;line-height:1.2;margin:0;overflow-wrap:anywhere}
  .marco .kicker{margin-bottom:4px}
  .smart{list-style:none;margin:0;padding:0;display:grid;gap:14px}
  .smart li{min-width:0;display:flex;flex-direction:column;gap:3px}
  .t,.kv .k{font-size:.8rem;font-weight:800;color:var(--ink-soft);letter-spacing:.02em}
  .a{white-space:pre-wrap;overflow-wrap:anywhere}
  .a.sub{color:var(--ink-soft);font-size:.92rem}
  .empty{color:var(--ink-soft);font-style:italic}
  .dates{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  .dbox{display:flex;flex-direction:column;background:var(--bg);border-radius:14px;padding:10px 12px}
  .dbox.folga{background:var(--sky-soft)}
  .dbox .k{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
  .dbox .v{font-weight:700}
  .kvs{display:grid;gap:14px}
  .kv{display:flex;flex-direction:column;gap:2px;min-width:0}

  .bar{height:14px;border-radius:99px;background:var(--surface-2);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--pink);border-radius:99px;transition:width .3s}
  .bar.sky i{background:var(--sky-dark)}
  .mrow{margin-bottom:14px}
  .mrow:last-child{margin-bottom:0}
  .mrow-h{display:flex;justify-content:space-between;gap:12px;margin-bottom:6px;font-weight:700}
  .mrow-h span{min-width:0;overflow-wrap:anywhere}

  .tag{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);margin-left:6px;vertical-align:middle}
  .tag.m1{background:var(--pink-soft);color:var(--pink-ink)}
  .tag.m2{background:var(--sky-soft);color:var(--sky-ink)}
  .tag.free{background:var(--sky-soft);color:var(--sky-ink)}
  .tag.now{background:var(--sun);color:var(--sun-ink)}
  .tag.shared{background:var(--sky-soft);color:var(--sky-ink)}

  .tasks{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:4px}
  .task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:4px 0}
  .task-t{overflow-wrap:anywhere}
  .task.done .task-t{text-decoration:line-through;color:var(--ink-soft)}
  .check{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--pink);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0;color:transparent}
  .check svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
  .check[aria-checked="true"]{background:var(--pink);color:var(--ink)}
  .x{background:none;border:none;color:var(--ink-soft);font-size:1.3rem;line-height:1;padding:6px 10px;cursor:pointer;border-radius:10px}
  .addrow{display:flex;flex-wrap:wrap;gap:8px}
  .addrow input{flex:1 1 200px;width:auto}
  .addrow select{flex:0 1 auto;width:auto;max-width:100%}
  .empty-tasks{margin:0 0 10px;color:var(--ink-soft)}

  .day{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .day+.day{margin-top:10px}
  .day.today{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-soft)}
  .day-h{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-bottom:8px;font-weight:800}
  .weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  .weeknav .range{font-family:var(--font-display);font-weight:600;font-size:1.15rem;text-align:center;flex:1}
  .navarrow{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.3rem;cursor:pointer}

  .dots{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;margin:10px 0 8px}
  .dotcol{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.68rem;color:var(--ink-soft);font-weight:700}
  .dd{width:100%;max-width:22px;aspect-ratio:1;border-radius:50%;background:var(--surface-2)}
  .dd.on{background:var(--pink)}
  .dd.today{outline:2px solid var(--ink);outline-offset:1px}

  .entry{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-top:10px}
  .entry-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;margin-bottom:8px}
  .entry-h strong{font-weight:800}
  .entry p{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
  .entry .q{font-size:.8rem;font-weight:800;color:var(--ink-soft);display:block}
  .entry-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}

  .hard{display:grid;gap:12px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
  @media (max-width:520px){.panel{padding:18px 16px}}
  .panel.big{background:var(--hero);border-color:transparent}
  .panel.step{background:var(--sun-soft);border-color:transparent}
  .panel p{margin:0}
  .panel .kicker{margin-bottom:8px}
  .xl{font-size:1.22rem;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
  .steplist{margin:8px 0 0;padding-left:20px;display:grid;gap:4px}

  .client{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-top:12px}
  .client-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;margin-bottom:10px}
  .client h3{font-family:var(--font-display);font-weight:600;font-size:1.25rem;margin:0}
  .client details{margin-top:10px}
  .client summary{cursor:pointer;font-weight:700;color:var(--pink-ink)}

  .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .stat{background:var(--bg);border-radius:16px;padding:12px 14px}
  .stat b{display:block;font-family:var(--font-display);font-size:1.7rem;font-weight:600;line-height:1.1}
  .stat span{font-size:.82rem;color:var(--ink-soft);font-weight:600}
  .conq{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-top:10px}
  .conq blockquote{margin:8px 0 0;padding:10px 12px;background:var(--sun-soft);color:var(--sun-ink);border-radius:12px;font-size:.92rem;white-space:pre-wrap;overflow-wrap:anywhere}
  .tag.done{background:var(--sun);color:var(--sun-ink)}
  .reset{margin-top:8px}
  .reset p{margin:0 0 10px}
  #copytext{margin-top:12px;min-height:200px}
  .foot{margin:22px 0 0;font-size:.85rem;color:var(--ink-soft)}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
  .daynote{margin:8px 0 0;font-size:.95rem;color:var(--ink)}
  .pill-tour{background:var(--pink-soft);border-color:var(--pink);color:var(--pink-ink)}
  .tour{position:fixed;z-index:25;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
    bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;background:var(--surface);border:2px solid var(--pink);
    border-radius:20px;padding:16px 18px;box-shadow:0 10px 30px rgba(45,54,80,.22)}
  .tour[hidden]{display:none}
  .tour .kicker{margin:0 0 4px}
  .tour h2{font-family:var(--font-display);font-weight:600;font-size:1.2rem;margin:0 0 6px}
  .tour p.t{margin:0 0 12px;color:var(--ink)}
  .tour .tour-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tour .spacer{flex:1}
  body.tour-on main{padding-bottom:250px}
  .tab.tour-hl{outline:3px solid var(--pink-ink);outline-offset:-3px;background:var(--pink-soft);color:var(--pink-ink)}
</style>
</head><body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path class="p" d="M4 22 L14 13 L24 6"/><circle class="d0" cx="4" cy="22" r="2.5"/><circle class="d1" cx="14" cy="13" r="3.2"/><circle class="d2" cx="24" cy="6" r="3.2"/></svg>
      <span>Meu Plano 2027</span>
    </div>
    <span class="status" id="status" aria-live="polite"></span>
  </header>
  <div class="hdr-actions">

(function(){

  var ICONS={
    hoje:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',

    diario:'<path d="M6 3.5h11a2 2 0 0 1 2 2v14a1 1 0 0 1-1 1H7a2 2 0 0 1-2-2V4.5a1 1 0 0 1 1-1z"/><path d="M9 8h7M9 12h7"/>',
    progresso:'<path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15l4-5 3 3 4-6"/>',
    plano:'<path d="M6 21V4"/><path d="M6 5h11l-2.5 4L17 13H6"/>'
  };

  var main=document.getElementById('main');

  function blankMarco(){return {nome:'',s:'',m:'',dias:[],horas:'',obs:'',r:'',prazo:'',folga:30,pct:0,feito:false,feitoEm:''};}
  function blank(){

  }

  var state=blank();

  var introIdx=0, weekRef=null, draft=null, confirmDel=null, ci=null, ciDone=false;
  var sharedList=[], seenBefore=0, fin=null, celebra=null, rmDraft=null;

  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  /* ---------- armazenamento ---------- */
  function merge(base,o){
    if(!o||typeof o!=='object') return base;
    Object.keys(base).forEach(function(k){
      var b=base[k], v=o[k];
      if(v===undefined||v===null) return;
      if(Array.isArray(b)){
        if(!Array.isArray(v)) return;
        if(k==='dias') base[k]=v.filter(function(n){return Number.isInteger(n)&&n>=0&&n<7;});
        else if(b.length&&typeof b[0]==='object') base[k]=b.map(function(item,i){return merge(item,v[i]);});
        else base[k]=v;
      } else if(b&&typeof b==='object'){
        if(Object.keys(b).length===0) base[k]=(typeof v==='object')?v:b;
        else base[k]=merge(b,v);
      } else if(typeof b===typeof v){ base[k]=v; }
    });
    return base;
  }
  function load(){
    try{
      var raw=localStorage.getItem(KEY);
      if(raw) state=merge(blank(),JSON.parse(raw));
    }catch(e){ storageOk=false; }
    try{ seenBefore=parseInt(localStorage.getItem(SEEN_KEY),10)||0; }catch(e){}
  }
  function persistLocal(){
    if(demoReal) return;
    try{ localStorage.setItem(KEY,JSON.stringify(state)); storageOk=true; }catch(e){ storageOk=false; }
  }
  function save(){
    if(demoReal) return;
    state.updatedAt=Date.now();
    persistLocal();
    clearTimeout(cloudTimer);
    cloudTimer=setTimeout(pushCloud,1200);
    updateStatus();
  }
  function saveSoon(){ clearTimeout(saveTimer); saveTimer=setTimeout(save,250); }

  function hasData(s){
    return !!(s.nome||s.concurso||s.cena||s.porque||s.marcos.some(function(m){return m.nome||m.s||m.m||m.r||m.prazo;})||s.passo.oque||s.hard.frase||s.hard.minimo);
  }
  function sharedBody(){
    var ws=weekStats(isoOf(mondayOf(today0())));
    return {
      nome:state.nome||'', objetivo:state.concurso||'',
      marcos:state.marcos.map(function(mk,i){
        var c=calcMarco(i);
        return {nome:mk.nome||'',pct:mk.pct||0,prazo:mk.prazo||'',internal:(c&&c.valid)?isoOf(c.internal):''};
      }),
      semana:{feitas:ws.done,total:ws.total}, dias14:activeCount(14),
      checkins:state.checkins.slice(-12),
      diario:state.diary.filter(function(e){return e.share;}).slice(-12).map(function(e){return {date:e.date,humor:e.humor||'',a:e.a||'',b:e.b||'',c:e.c||'',d:e.d||'',e:e.e||''};}),
      activityAt:state.lastShareAt||0, updatedAt:Date.now()
    };
  }
  function pushCloud(){
    if(demoReal) return Promise.resolve();
    if(!cloud.doc&&!cloud.sharedDoc) return Promise.resolve();
    if(pushing){ pendingPush=true; return Promise.resolve(); }
    pushing=true;
    var p=Promise.resolve();
    if(cloud.doc){
      var body={state:clone(state),updatedAt:state.updatedAt};
      p=p.then(function(){ return cloud.doc.set(body); }).then(function(){ cloud.ok=true; }).catch(function(e){
        cloud.ok=false;
        if(e&&e.code==='invalid_argument') cloud.doc=null;
      });
    }
    p=p.then(function(){
      if(!cloud.sharedDoc) return;
      if(state.shareOn){
        if(!hasData(state)) return;
        return cloud.sharedDoc.set(sharedBody()).then(function(){ cloud.shared='ok'; });
      }
      return cloud.sharedDoc.delete().then(function(){ cloud.shared='off'; });
    }).catch(function(e){
      if(e&&e.code==='invalid_argument'){ cloud.shared='noaccess'; cloud.sharedDoc=null; }
      else cloud.shared='error';
    }).then(function(){
      pushing=false;
      if(pendingPush){ pendingPush=false; pushCloud(); }
      updateStatus();
    });
    return p;
  }
  function watchShared(db){
    if(cloud.unsub) return;
    try{
      cloud.unsub=db.collection('shared').onSnapshot(function(snap){
        sharedList=snap.docs.map(function(d){ return {id:d.id,data:d.data()||{}}; });
        sharedList.sort(function(a,b){ return (b.data.activityAt||0)-(a.data.activityAt||0); });
        updateChrome();
        if(state.view==='mentora') render({keep:true});
      },function(){ sharedList=[]; });
    }catch(e){}
  }
  function initCloud(){
    try{
      if(!window.claude||typeof window.claude.use!=='function') return;
      Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
        var db=r[0], user=r[1];
        if(!db||!user) return;
        return Promise.all([user.id(),user.isOwner()]).then(function(x){
          var id=x[0];
          cloud.owner=!!x[1];
          updateChrome();
          if(cloud.owner) watchShared(db);
          if(!id) return;
          cloud.id=id;
          var doc=db.doc('data/users/'+id+'/plano');
          cloud.sharedDoc=db.doc('shared/'+id);
          return doc.get().then(function(snap){
            var d=snap.exists?snap.data():null;
            var remote=d&&d.state, rAt=(d&&typeof d.updatedAt==='number')?d.updatedAt:0;
            cloud.doc=doc;
            if(remote&&rAt>state.updatedAt&&!demoReal){
              state=merge(blank(),remote);
              state.updatedAt=rAt;
              fixState();
              persistLocal();
              cloud.ok=true;
              render();
            } else if(hasData(state)&&state.updatedAt>rAt){
              pushCloud();
            } else if(snap.exists){
              cloud.ok=true;
            }
            updateStatus();
          });
        });
      }).catch(function(){ cloud.doc=null; });
    }catch(e){ cloud.doc=null; }
  }

  function getP(path){ return path.split('.').reduce(function(o,k){return o==null?o:o[k];},state); }
  function setP(path,val){
    var ks=path.split('.'), o=state;
    for(var i=0;i<ks.length-1;i++) o=o[ks[i]];

  }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});
  }
  function toast(msg){
    var el=document.getElementById('toast'); if(!el) return;

  function praise(){ return PRAISE[Math.floor(Math.random()*PRAISE.length)]; }

  /* ---------- datas e números ---------- */
  function today0(){ var d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
  function parseISO(s){
    if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
    var p=s.split('-').map(Number), d=new Date(p[0],p[1]-1,p[2]);
    return isNaN(d.getTime())?null:d;
  }
  function addDays(d,n){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n); }
  function diffDays(a,b){ return Math.round((b.getTime()-a.getTime())/DAY_MS); }
  function fmtLong(d){ return d.toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'}); }
  function fmtDM(d){ return d.toLocaleDateString('pt-BR',{day:'numeric',month:'long'}); }
  function isoOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function mondayOf(d){ var dow=(d.getDay()+6)%7; return new Date(d.getFullYear(),d.getMonth(),d.getDate()-dow); }
  function fmtRange(a,b){
    var ma=a.toLocaleDateString('pt-BR',{month:'long'}), mb=b.toLocaleDateString('pt-BR',{month:'long'});
    return a.getMonth()===b.getMonth()?a.getDate()+' a '+b.getDate()+' de '+ma:a.getDate()+' de '+ma+' a '+b.getDate()+' de '+mb;
  }
  function ago(ts){
    var d=Math.floor((Date.now()-ts)/DAY_MS);
    if(d<=0) return 'hoje';
    if(d===1) return 'ontem';
    return 'há '+d+' dias';
  }
  function pl(n){ return n+' '+(n===1?'dia':'dias'); }
  function livres(n){ return n===0?'nenhum dia livre':(n===1?'1 dia livre':n+' dias livres'); }
  function num(v){ var n=parseFloat(String(v==null?'':v).replace(',','.')); return (isFinite(n)&&n>0)?n:0; }
  function fmtH(x){ return (Math.round(x*10)/10).toString().replace('.',',')+' h'; }
  function sortedDias(mk){ return (mk.dias||[]).slice().sort(function(a,b){return a-b;}); }
  function moodLabel(k){ for(var i=0;i<MOODS.length;i++) if(MOODS[i][0]===k) return MOODS[i][1]; return ''; }

  function calcMarco(i){
    var mk=state.marcos[i], prazo=parseISO(mk.prazo);
    if(!prazo) return null;
    var start=today0();
    if(i===1){
      var p1=parseISO(state.marcos[0].prazo);
      if(p1&&p1.getTime()>start.getTime()&&p1.getTime()<prazo.getTime()) start=p1;
    }
    var total=diffDays(start,prazo);
    if(total<=0) return {valid:false,prazo:prazo,start:start,total:total};
    var pct=[20,30,40].indexOf(mk.folga)>=0?mk.folga:30;
    var workDays=Math.floor(total*(100-pct)/100);
    return {valid:true,prazo:prazo,start:start,total:total,pct:pct,workDays:workDays,folgaDays:total-workDays,internal:addDays(start,workDays)};
  }
  function whereInfo(){
    var t=today0();
    for(var i=0;i<2;i++){
      var c=calcMarco(i);
      if(c&&c.valid) return {i:i,c:c,dInt:diffDays(t,c.internal),dPraz:diffDays(t,c.prazo)};
    }
    return null;
  }
  function whereSentence(w){
    if(w.dInt>0) return 'Faltam <strong>'+pl(w.dInt)+'</strong> para a meta interna do Marco '+(w.i+1)+' e '+pl(w.dPraz)+' para o prazo final.';
    return 'Você está dentro da folga do Marco '+(w.i+1)+'. Faltam '+pl(w.dPraz)+' para o prazo final.';
  }

      segs.push({k:'f',label:'Marco 1, folga',from:c1.internal,to:c1.prazo});

    if(ok2&&(!ok1||c2.start.getTime()===c1.prazo.getTime())){
      segs.push({k:'w',label:'Marco 2, trabalho',from:c2.start,to:c2.internal});
      segs.push({k:'f',label:'Marco 2, folga',from:c2.internal,to:c2.prazo});
    }
    return segs;
  }

  /* ---------- semana, passos e constância ---------- */
  function weekStats(monIso){
    var d0=parseISO(monIso)||mondayOf(today0()), total=0, done=0;
    for(var i=0;i<7;i++){
      var ts=state.tasks[isoOf(addDays(d0,i))]||[];
      total+=ts.length;
      done+=ts.filter(function(x){return x.d;}).length;
    }
    return {total:total,done:done};
  }
  function isActiveDay(iso){
    var ts=state.tasks[iso];
    if(ts&&ts.some(function(x){return x.d;})) return true;
    return !!state.minDone[iso];
  }
  function activeCount(n){
    var t=today0(), c=0;
    for(var i=0;i<n;i++){ if(isActiveDay(isoOf(addDays(t,-i)))) c++; }
    return c;
  }
  function freeDow(dow){
    var u=[];
    state.marcos.forEach(function(mk){ (mk.dias||[]).forEach(function(d){ if(u.indexOf(d)<0) u.push(d); }); });

  function fixState(){
    if(!Number.isInteger(state.step)||state.step<0||state.step>=STEPS.length) state.step=0;
    var map={plan:'plano',hard:'porque'};
    if(map[state.view]) state.view=map[state.view];
    if(VIEWS.indexOf(state.view)<0||state.view==='como'||state.view==='mentora') state.view='hoje';
    if(!state.seen&&hasData(state)) state.seen=true;
    if(!state.seen) state.view='intro';
    else if(state.view==='intro') state.view='hoje';
  }

  /* ---------- peças do plano ---------- */
  function fieldHTML(f){
    var id='f-'+f.path.replace(/\./g,'-');
    var v=getP(f.path);
    var opt=f.optional?' <span class="lbl-sub">(opcional)</span>':'';
    var lblCls=f.hide?'lbl sr-only':'lbl';
    var ctl='';
    if(f.type==='text'){
      ctl='<input type="text" id="'+id+'" data-path="'+f.path+'" value="'+esc(v)+'" placeholder="'+esc(f.ph||'')+'" autocomplete="off">';
    } else if(f.type==='area'){
      ctl='<textarea id="'+id+'" data-path="'+f.path+'" rows="'+(f.rows||5)+'" placeholder="'+esc(f.ph||'')+'">'+esc(v)+'</textarea>';
    } else if(f.type==='date'){
      ctl='<input type="date" id="'+id+'" data-path="'+f.path+'" value="'+esc(v)+'">';
    } else if(f.type==='hours'){
      ctl='<div class="inline"><input type="number" id="'+id+'" data-path="'+f.path+'" value="'+esc(v)+'" min="0" max="12" step="0.5" inputmode="decimal" placeholder="2"><span class="suffix">horas por dia</span></div>';
    } else if(f.type==='days'){
      var sel=Array.isArray(v)?v:[];
      ctl='<div class="chips" role="group" aria-labelledby="'+id+'-l">'+DAYS.map(function(d,i){
        return '<button type="button" class="chip" data-act="day" data-path="'+f.path+'" data-val="'+i+'" aria-pressed="'+(sel.indexOf(i)>=0)+'">'+d+'</button>';
      }).join('')+'</div>';
      return '<div class="field"><div class="lbl" id="'+id+'-l">'+esc(f.label)+'</div>'+ctl+'</div>';
    } else if(f.type==='folga'){
      var opts=[[20,'20% (justa)'],[30,'30% (equilibrada)'],[40,'40% (bem folgada)']];
      var cur=[20,30,40].indexOf(v)>=0?v:30;
      ctl='<div class="chips folga" role="group" aria-labelledby="'+id+'-l">'+opts.map(function(o){
        return '<button type="button" class="chip" data-act="folga" data-path="'+f.path+'" data-val="'+o[0]+'" aria-pressed="'+(cur===o[0])+'">'+o[1]+'</button>';
      }).join('')+'</div>';
      return '<div class="field"><div class="lbl" id="'+id+'-l">'+esc(f.label)+'</div>'+ctl+'</div>';
    }
    return '<div class="field"><label class="'+lblCls+'" for="'+id+'">'+esc(f.label)+opt+'</label>'+ctl+'</div>';
  }

  function extraHTML(st){
    var mk=state.marcos[st.marco];
    if(st.extra==='ritmo'){
      var dias=sortedDias(mk), h=num(mk.horas);
      if(!dias.length||!h) return '<div class="info"><p>Escolha os dias e as horas para ver o seu ritmo da semana.</p></div>';
      var out='<div class="info"><p><strong>Seu ritmo:</strong> '+dias.map(function(d){return DAYS[d];}).join(', ')+', '+fmtH(h)+' por dia. São <strong>'+fmtH(dias.length*h)+' por semana</strong> e '+livres(7-dias.length)+'.</p></div>';
      if(dias.length===7) out+='<div class="note">Você marcou os 7 dias. Deixe pelo menos um dia livre por semana. Descansar faz parte do plano.</div>';
      if(h>4) out+='<div class="note">Esse é um ritmo grande. Se ele for novo para você, comece menor e aumente aos poucos.</div>';
      return out;
    }
    if(st.extra==='folga'){
      var c=calcMarco(st.marco);
      if(!c) return '<div class="info"><p>Escolha uma data para ver a sua folga.</p></div>';
      if(!c.valid) return '<div class="note">Essa data é hoje ou já passou. Escolha uma data futura para calcular a folga.</div>';
      var after=(st.marco===1&&c.start.getTime()!==today0().getTime())?', depois do Marco 1':'';
      var o='<div class="info"><p>Contando a partir de '+fmtLong(c.start)+after+', são <strong>'+pl(c.total)+'</strong> até o prazo.</p>'+
        '<div class="minibar"><span class="w" style="width:'+(100-c.pct)+'%"></span><span class="f" style="width:'+c.pct+'%"></span></div>'+
        '<ul class="mini-legend"><li><span class="dot w"></span>Trabalho até '+fmtLong(c.internal)+' ('+pl(c.workDays)+')</li>'+
        '<li><span class="dot f"></span>Folga até '+fmtLong(c.prazo)+' ('+pl(c.folgaDays)+')</li></ul>'+
        '<p>Combine consigo mesma que a sua meta é <strong>'+fmtLong(c.internal)+'</strong>. Se algo atrapalhar, você ainda tem '+pl(c.folgaDays)+' de folga antes do prazo final.</p></div>';
      var p1=parseISO(state.marcos[0].prazo);
      if(st.marco===1&&p1&&c.prazo.getTime()<=p1.getTime()) o+='<div class="note">Este prazo é igual ou anterior ao do Marco 1. Tudo bem se for de propósito.</div>';
      return o;
    }
    return '';
  }

  function progressHTML(){
    var cur=STEPS[state.step];
    return '<div class="progress" role="list" aria-label="Etapas">'+SECTIONS.map(function(name,i){
      var steps=STEPS.filter(function(s){return s.sec===i;});
      var pct=0;
      if(i<cur.sec) pct=100;
      else if(i===cur.sec){ pct=cur.kind==='pause'?100:Math.round(steps.indexOf(cur)/steps.length*100); }
      return '<div class="seg'+(i===cur.sec?' current':'')+'" role="listitem"><div class="seg-bar"><i style="width:'+pct+'%"></i></div><span class="seg-name">'+esc(name)+'</span></div>';
    }).join('')+'</div>';
  }

  function render(opts){

      try{
        var blob=new Blob([text],{type:'application/json'}), url=URL.createObjectURL(blob), a=document.createElement('a');

    }

    });
    if(!state.conquistas.length) L.push('(nenhuma conquista guardada ainda)','');
    L.push('MEU ANO ('+st.y+')','Marcos concluídos: '+st.marcos,'Objetivos concluídos: '+st.objs,'Passos feitos: '+st.passos,'Dias com passos: '+st.dias,'Anotações no diário: '+st.diario,'Registros semanais: '+st.regs,'Revisões mensais: '+st.meses);
    return L.join('\n');
  }
  function copyConq(){
    var txt=conqText();
    var msg=document.getElementById('cqmsg'), box=document.getElementById('cqbox'), ta=document.getElementById('cqtext');
    if(!msg||!box||!ta) return;
    ta.value=txt;
    function fb(){ box.hidden=false; ta.focus(); ta.select(); msg.textContent='Não consegui copiar sozinha. Selecione o texto abaixo e copie.'; }
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(function(){ msg.textContent='Texto copiado. Cole numa nota ou mensagem para guardar.'; }).catch(fb);
      } else fb();
    }catch(e){ fb(); }
  }
  var MENTORA_WHATSAPP=''; /* opcional: número da mentora com DDI e DDD, só dígitos. Ex.: 5511999999999 */
  function sendSumHTML(){
    return '<section class="card" style="margin-top:14px"><h2 class="h2">Enviar resumo para a minha mentora</h2>'+
      '<p class="muted small" style="margin:0 0 12px">O app monta uma mensagem curta com o seu progresso. Você confere, edita se quiser e manda pelo WhatsApp. Nada é enviado sozinho.</p>'+
      '<button type="button" class="btn btn-primary" data-act="sendsum">Enviar resumo para a minha mentora</button><div id="sumbox" aria-live="polite"></div></section>';
  }
  function summaryText(){
    var t=today0(), mon=isoOf(mondayOf(t)), ws=weekStats(mon), nm=(state.nome||'').trim();
    var L=['Resumo da semana'+(nm?' - '+nm:'')+' ('+fmtDM(t)+')',''];
    var ob=(state.concurso||'').trim();
    if(ob) L.push('Meu objetivo: '+ob,'');
    state.marcos.forEach(function(mk,i){
      var nome=(mk.nome||'').trim(), c=calcMarco(i);
      if(!nome&&!mk.prazo&&!mk.pct) return;
      L.push('Marco '+(i+1)+(nome?' ('+nome+')':'')+': '+(mk.pct||0)+'% pronto'+((c&&c.valid)?'. Meta interna '+fmtLong(c.internal)+', prazo '+fmtLong(c.prazo):''));
    });
    state.conquistas.filter(function(c){return c.data>=isoOf(addDays(t,-7));}).forEach(function(c){
      L.push('Concluí '+(c.tipo==='marco'?'o marco':'o objetivo')+': '+c.titulo+(c.sentimento?' ('+c.sentimento+')':''));
    });
    var lim=addDays(t,-7).toISOString();
    state.revMes.filter(function(r){return r.at>=lim;}).forEach(function(r){
      L.push('Fiz a revisão de '+mesNome(r.mes)+'.'+((r.r6||'').trim()?' Prioridade do próximo mês: '+r.r6.trim():''));
    });
    L.push('','Passos feitos nesta semana: '+ws.done+' de '+ws.total,'Dias com passos nos últimos 14: '+activeCount(14)+' de 14');
    var mood=state.mood[isoOf(t)];
    if(mood) L.push('Como estou hoje: '+moodLabel(mood));
    var last=state.checkins.length?state.checkins[state.checkins.length-1]:null;
    if(last){
      if(last.humor) L.push('Como me senti na semana: '+moodLabel(last.humor));
      if((last.funcionou||'').trim()) L.push('O que funcionou: '+last.funcionou.trim());
      if((last.ajustar||'').trim()) L.push('O que vou ajustar: '+last.ajustar.trim());
    }
    var since=isoOf(addDays(t,-7));
    var ds=state.diary.filter(function(e){return e.share&&e.date>=since;});
    if(ds.length){
      L.push('','Anotações do diário que quero compartilhar:');
      ds.forEach(function(e){
        var d=parseISO(e.date), parts=[e.a,e.b,e.c,e.d,e.e].filter(function(x){return (x||'').trim();}).map(function(x){return x.trim();});
        L.push('- '+(d?fmtDM(d):e.date)+(e.humor?' ('+moodLabel(e.humor)+')':'')+': '+parts.join(' / '));
      });
    }
    return L.join('\n');
  }
  function waLink(txt){
    var n=String(MENTORA_WHATSAPP).replace(/\D/g,'');
    return 'https://wa.me/'+n+'?text='+encodeURIComponent(txt);
  }
  function showSummary(){
    var box=document.getElementById('sumbox'); if(!box) return;
    var txt=summaryText();
    box.innerHTML='<div class="info"><p><strong>Confira antes de enviar.</strong> Você pode editar o texto abaixo.</p>'+
      '<textarea id="sumtext" rows="12" aria-label="Resumo para a minha mentora"></textarea>'+
      '<div class="actions" style="margin-top:12px"><button type="button" class="btn btn-ghost" data-act="copysum">Copiar texto</button>'+
      '<a class="btn btn-primary" id="sumlink" target="_blank" rel="noopener" href="'+esc(waLink(txt))+'">Abrir no WhatsApp</a>'+
      '<span id="summsg" class="muted small" role="status"></span></div></div>';
    document.getElementById('sumtext').value=txt;
  }
  function copySummary(){
    var ta=document.getElementById('sumtext'), msg=document.getElementById('summsg');
    if(!ta||!msg) return;
    function fb(){ ta.focus(); ta.select(); msg.textContent='Não consegui copiar sozinha. Selecione o texto e copie.'; }
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(ta.value).then(function(){ msg.textContent='Texto copiado. Cole na conversa com a sua mentora.'; }).catch(fb);
      } else fb();
    }catch(e){ fb(); }
  }
  function resetAll(){
    clearTimeout(saveTimer); clearTimeout(cloudTimer);
    state=blank();
    try{ localStorage.removeItem(KEY); }catch(e){}
    state.updatedAt=Date.now();
    draft=null; ci=null; introIdx=0; weekRef=null; fin=null; celebra=null; rmDraft=null;
    if(cloud.doc){ cloud.doc.set({state:clone(state),updatedAt:state.updatedAt}).catch(function(){}); }
    if(cloud.sharedDoc){ cloud.sharedDoc.delete().catch(function(){}); }
    render();
  }

  document.addEventListener('click',function(e){
    var b=e.target.closest?e.target.closest('[data-act]'):null;
    if(!b) return;
    var act=b.getAttribute('data-act'), date=b.getAttribute('data-date'), id=b.getAttribute('data-id'), val=b.getAttribute('data-val');
    if(tourIdx!==null&&act==='view') tourClose(false);
    if(act==='view') setView(b.getAttribute('data-view'));
    else if(act==='bk-save') bkSave();
    else if(act==='bk-import'){ var bf=document.getElementById('bk-file'); if(bf) bf.click(); }
    else if(act==='bk-yes') bkApply();
    else if(act==='bk-no'){ bkPending=null; render({keep:true}); }
    else if(act==='tour-start') tourStart();
    else if(act==='tour-next') tourShow(tourIdx+1);
    else if(act==='tour-prev') tourShow(tourIdx-1);
    else if(act==='tour-close') tourClose(true);
    else if(act==='next'||act==='skip') next();
    else if(act==='prev') go(state.step-1);
    else if(act==='stop') setView('plano');
    else if(act==='edit') goToId(b.getAttribute('data-step'));
    else if(act==='day') toggleDay(b);
    else if(act==='folga') setFolga(b);
    else if(act==='copy') doCopy();
    else if(act==='fin-open'){ fin={tipo:b.getAttribute('data-tipo'),idx:Number(b.getAttribute('data-idx'))||0,sent:''}; render(); }
    else if(act==='fin-cancel'){ fin=null; render(); }
    else if(act==='fin-save') finSave();
    else if(act==='newmarco') newMarco(Number(b.getAttribute('data-idx'))||0);
    else if(act==='newobj') newObjetivo();
    else if(act==='copyconq') copyConq();
    else if(act==='rmsave') saveMensal();
    else if(act==='sendsum') showSummary();
    else if(act==='copysum') copySummary();
    else if(act==='demo') startDemo();
    else if(act==='exit-demo') endDemo(false);
    else if(act==='intro-next'){
      if(introIdx>=HOW.length-1){ state.seen=true; introIdx=0; state.step=0; state.view='wizard'; persistLocal(); render(); }
      else { introIdx++; render(); }
    }
    else if(act==='intro-prev'){ introIdx=Math.max(0,introIdx-1); render(); }
    else if(act==='intro-skip'){ state.seen=true; introIdx=0; state.step=0; state.view='wizard'; persistLocal(); render(); }
    else if(act==='mood'){ state.mood[isoOf(today0())]=val; save(); render({keep:true}); }
    else if(act==='toggle') toggleTask(date,id);
    else if(act==='deltask') delTask(date,id);
    else if(act==='addtask') addTask(date);
    else if(act==='addhard') addHard();
    else if(act==='delhard'){ state.hard.passos.splice(Number(b.getAttribute('data-idx')),1); save(); render({keep:true}); }
    else if(act==='minfeito') toggleMin();
    else if(act==='usemin') useMin();
    else if(act==='wk-prev'){ weekRef=addDays(weekRef||mondayOf(today0()),-7); render(); }
    else if(act==='wk-next'){ weekRef=addDays(weekRef||mondayOf(today0()),7); render(); }
    else if(act==='wk-now'){ weekRef=mondayOf(today0()); render(); }
    else if(act==='dmood'){ if(draft){ draft.humor=(draft.humor===val)?'':val; } render({keep:true}); }
    else if(act==='dsave') saveDiary();
    else if(act==='dedit'){
      state.diary.forEach(function(x){ if(x.id===id) draft=draftFrom(x); });
      render();
    }
    else if(act==='ddel'){ confirmDel=id; render({keep:true}); }
    else if(act==='ddel-no'){ confirmDel=null; render({keep:true}); }
    else if(act==='ddel-yes'){
      state.diary=state.diary.filter(function(x){return x.id!==id;});
      if(draft&&draft.id===id) draft=newDraft(draft.date);
      confirmDel=null; save(); render({keep:true});
    }
    else if(act==='cimood'){ if(ci){ ci.humor=(ci.humor===val)?'':val; } render({keep:true}); }
    else if(act==='cisave') saveCheckin();
    else if(act==='share-toggle'){ state.shareOn=!!b.checked; save(); updateStatus(); }
    else if(act==='reset-ask'){
      var area=document.getElementById('reset-area');
      if(area) area.innerHTML='<p>Isso apaga todas as suas respostas, passos e anotações. Deseja continuar?</p><div class="actions" style="margin-top:0"><button type="button" class="btn btn-danger" data-act="reset-yes">Apagar tudo</button><button type="button" class="btn btn-ghost" data-act="reset-no">Cancelar</button></div>';
    }
    else if(act==='reset-yes') resetAll();
    else if(act==='reset-no') render();
  });
  function onInput(e){
    var t=e.target;
    if(!t||!t.getAttribute) return;
    if(t.id==='bk-file'){ bkRead(t); return; }
    if(t.getAttribute('data-fin')&&fin){ fin.sent=t.value; return; }
    var rk=t.getAttribute('data-rm'); if(rk&&rmDraft){ rmDraft[rk]=t.value; return; }
    if(t.id==='sumtext'){ var lk=document.getElementById('sumlink'); if(lk) lk.href=waLink(t.value); return; }
    var path=t.getAttribute('data-path');
    if(path&&!t.getAttribute('data-act')){ setP(path,t.value); saveSoon(); refreshExtra(); return; }
    var wk=t.getAttribute('data-wk');
    if(wk){ weekData(isoOf(weekRef||mondayOf(today0())))[wk]=t.value; saveSoon(); return; }
    var dr=t.getAttribute('data-draft');
    if(dr&&draft){
      if(dr==='date'){
        if(e.type==='change'&&t.value){ draft=newDraft(t.value); render({keep:true}); }
        return;
      }
      if(dr==='share') draft.share=!!t.checked; else draft[dr]=t.value;
      return;
    }
    var ck=t.getAttribute('data-ci');
    if(ck&&ci){
      if(ck.indexOf('pct')===0){
        var i=Number(ck.slice(3)); ci.pcts[i]=Number(t.value);
        var o=document.getElementById('pct-out-'+i); if(o) o.textContent=t.value+'%';
      } else ci[ck]=t.value;
    }
  }
  document.addEventListener('input',onInput);
  document.addEventListener('change',onInput);
  document.addEventListener('keydown',function(e){
    if(e.key!=='Enter') return;
    var t=e.target;
    if(!t||t.tagName!=='INPUT') return;
    var tid=t.id||'';
    if(tid==='add-hard'){ e.preventDefault(); addHard(); return; }
    if(tid.indexOf('add-')===0){ e.preventDefault(); addTask(tid.slice(4)); return; }
    if(state.view==='wizard'){
      var btn=main.querySelector('[data-act="next"]');
      if(btn){ e.preventDefault(); btn.click(); }
    }
  });

  tabbarIn.innerHTML=TABS.map(function(t){
    return '<button type="button" class="tab" data-act="view" data-view="'+t[0]+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[t[0]]+'</svg><span>'+t[1]+'</span></button>';
  }).join('');

  load();
  fixState();
  render();
})();
</script>
</body></html>
